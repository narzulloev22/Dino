<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<title>Мой Дракоша</title>
<style>
  :root{
    --bg1:#0b0820; --bg2:#1a1050; --violet:#a855f7; --pink:#f472b6; --cyan:#22d3ee;
    --panel:rgba(255,255,255,.07); --line:rgba(255,255,255,.14); --text:#f1ecff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg1);color:var(--text);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
  body{display:flex;justify-content:center}
  #app{position:relative;width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);overflow:hidden;
    background:radial-gradient(120% 70% at 50% 35%,#2b1a73 0%,var(--bg2) 40%,var(--bg1) 100%);
    transition:background 1.2s}
  #app.mood-sad{background:radial-gradient(120% 70% at 50% 35%,#1d2150 0%,#10153a 45%,#070914 100%)}
  #app.mood-happy{background:radial-gradient(120% 70% at 50% 35%,#4a1f9a 0%,#2a1470 42%,#0d0828 100%)}

  .stars{position:absolute;inset:0;pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 15%,#fff,transparent),
      radial-gradient(1px 1px at 70% 10%,#cbb8ff,transparent),
      radial-gradient(1.5px 1.5px at 85% 40%,#fff,transparent),
      radial-gradient(1px 1px at 10% 55%,#9be7ff,transparent),
      radial-gradient(1.5px 1.5px at 40% 30%,#fff,transparent),
      radial-gradient(1px 1px at 60% 70%,#e0c7ff,transparent),
      radial-gradient(1px 1px at 30% 80%,#fff,transparent);
    animation:twinkle 4s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.45}to{opacity:1}}

  .top{position:relative;z-index:3;display:flex;align-items:center;gap:8px;padding:10px 0 6px}
  .name{flex:1;font-size:20px;font-weight:700;letter-spacing:.3px;background:none;border:0;color:var(--text);
    text-align:left;padding:4px 0;cursor:pointer}
  .name small{display:block;font-size:12px;font-weight:400;opacity:.7;letter-spacing:0}
  .chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px}
  .icon-btn{width:38px;height:38px;border-radius:50%;background:var(--panel);border:1px solid var(--line);
    color:var(--text);font-size:17px;cursor:pointer}

  .stats{position:relative;z-index:3;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 7px}
  .stat .l{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:5px}
  .stat .l span:first-child{font-size:15px}
  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  .bar i{display:block;height:100%;width:50%;border-radius:99px;transition:width .6s,background .6s;background:var(--cyan)}
  .stat.low{border-color:#fb7185;animation:pulse 1s ease-in-out infinite alternate}
  @keyframes pulse{to{background:rgba(251,113,133,.18)}}

  .stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;z-index:2}
  .floor{position:absolute;bottom:4%;left:50%;width:62%;height:7%;transform:translateX(-50%);
    background:radial-gradient(ellipse at center,rgba(168,85,247,.55),transparent 70%);filter:blur(6px);transition:opacity 1s}
  .mood-sad .floor{opacity:.35}
  .bubble{position:absolute;top:2%;left:50%;transform:translateX(-50%);max-width:88%;z-index:6;
    background:#fff;color:#1b1040;font-weight:700;font-size:15px;line-height:1.25;padding:9px 14px;border-radius:16px;
    text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
  .bubble.on{opacity:1}
  .bubble:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;
    border-bottom:0;border-top-color:#fff}

  /* ===== питомец ===== */
  #petWrap{position:relative;width:min(88%,56dvh);aspect-ratio:1;cursor:pointer;touch-action:none}
  #petLook{position:absolute;inset:0;transition:transform .4s ease-out;transform-origin:50% 90%}
  #petBody{position:absolute;inset:0;transform-origin:50% 92%;
    filter:drop-shadow(0 0 22px rgba(168,85,247,.55));animation:breathe 3.2s ease-in-out infinite;
    transition:filter .8s}
  #petBody img,#face{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
  #petOpen{opacity:0;transition:opacity .22s}
  #petOpen.on{opacity:1}
  #face{overflow:visible}
  #mouth{transition:opacity .2s}
  .tear{opacity:0;transition:opacity .5s}
  #face.cry .tear{opacity:1}
  .tear path{fill:rgba(140,220,255,.92);stroke:#fff;stroke-width:1.5;animation:tearfall 1.7s ease-in infinite}
  .tear.b path{animation-delay:.85s}
  @keyframes tearfall{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translateY(80px) scale(1.1);opacity:0}}

  @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.035)}}
  #petWrap.tap #petBody{animation:squish .45s ease-out}
  @keyframes squish{0%{transform:scale(1)}25%{transform:scale(1.1,.86)}55%{transform:scale(.94,1.1)}100%{transform:scale(1)}}
  #petWrap.shake #petBody{animation:shake .5s ease-in-out}
  @keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
  #petWrap.jump #petBody{animation:jump .9s ease-in-out 2}
  @keyframes jump{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-9%) scale(.96,1.06)}50%{transform:translateY(-10%) rotate(-4deg)}70%{transform:translateY(-4%) rotate(4deg)}}
  #petWrap.hop #petBody{animation:hop .6s ease-out}
  @keyframes hop{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-6%) scale(.97,1.05)}60%{transform:translateY(0) scale(1.05,.94)}}
  #petWrap.eat #petBody{animation:chomp .35s ease-in-out 3}
  @keyframes chomp{0%,100%{transform:scale(1)}50%{transform:scale(1.06,.93)}}
  #petWrap.sad #petBody{animation:sad 3.6s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(110,120,180,.45)) saturate(.65) brightness(.88)}
  @keyframes sad{0%,100%{transform:translateY(2%) scale(1,.95) rotate(-1.5deg)}50%{transform:translateY(2.5%) scale(1,.935) rotate(1.5deg)}}
  #petWrap.cry #petBody{animation:sob 1.1s ease-in-out infinite}
  @keyframes sob{0%,100%{transform:translateY(2%) scale(1,.95) rotate(-1deg)}25%{transform:translateY(1.2%) scale(1.01,.965)}50%{transform:translateY(2.6%) scale(1,.94) rotate(1deg)}75%{transform:translateY(1.4%) scale(1.01,.96)}}
  #petWrap.happy #petBody{filter:drop-shadow(0 0 26px rgba(217,110,255,.75)) saturate(1.15)}
  #petWrap.sleep #petBody{animation:sleepb 4s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(80,60,160,.6)) brightness(.45) saturate(.8)}
  @keyframes sleepb{0%,100%{transform:scale(1,.97)}50%{transform:scale(1.02,1)}}
  #petWrap.dirty #petBody{filter:drop-shadow(0 0 14px rgba(120,100,60,.6)) sepia(.55) brightness(.85)}

  .night{position:absolute;inset:0;background:rgba(3,2,20,.55);opacity:0;pointer-events:none;transition:opacity .8s;z-index:4}
  .night.on{opacity:1}

  .fx{position:absolute;pointer-events:none;font-size:28px;z-index:7;animation:floatUp 1.2s ease-out forwards}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-90px) scale(1.2)}}
  .zzz{position:absolute;right:16%;top:18%;font-size:30px;font-weight:700;color:#c9b8ff;z-index:6;display:none;
    animation:zz 2.4s ease-in-out infinite}
  .zzz.on{display:block}
  @keyframes zz{0%{opacity:0;transform:translate(0,10px) scale(.7)}50%{opacity:1}100%{opacity:0;transform:translate(14px,-30px) scale(1.2)}}
  .foodFly{position:absolute;font-size:44px;z-index:8;left:50%;top:92%;animation:fly .8s ease-in forwards}
  @keyframes fly{to{top:44%;transform:scale(.4);opacity:.2}}
  .bubbles{position:absolute;inset:0;z-index:5;pointer-events:none;display:none;overflow:hidden}
  .bubbles.on{display:block}
  .bubbles span{position:absolute;bottom:-10%;border-radius:50%;border:2px solid rgba(255,255,255,.7);
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),rgba(120,220,255,.15));animation:rise 1.6s ease-in infinite}
  @keyframes rise{to{transform:translateY(-120%);opacity:0}}
  .rain{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s;z-index:1;overflow:hidden}
  .mood-cry .rain{opacity:1}
  .rain i{position:absolute;top:-10%;width:2px;height:16px;border-radius:2px;background:linear-gradient(transparent,rgba(150,190,255,.6));
    animation:drop 1.1s linear infinite}
  @keyframes drop{to{transform:translateY(120dvh)}}

  .dock{position:relative;z-index:3;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:8px 0 12px}
  .act{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;font-size:12px;font-weight:700;
    border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;
    transition:transform .12s,background .2s}
  .act b{font-size:26px;line-height:1}
  .act:active{transform:scale(.93);background:rgba(168,85,247,.35)}
  .act.on{background:linear-gradient(160deg,#7c3aed,#c026d3);border-color:transparent}
  .act:focus-visible,.icon-btn:focus-visible,.name:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

  .sheet{position:absolute;left:12px;right:12px;bottom:92px;z-index:9;background:#1d1255;border:1px solid var(--line);
    border-radius:20px;padding:12px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .sheet.on{display:block}
  .sheet h3{margin:0 0 10px;font-size:15px}
  .foods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .food{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 4px;color:var(--text);
    font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  .food b{font-size:32px}
  .food:active{transform:scale(.94)}
  .food.no{opacity:.4}

  #game{position:absolute;inset:0;z-index:20;background:radial-gradient(100% 60% at 50% 0,#3b1d96,#0b0820);display:none;overflow:hidden;touch-action:manipulation}
  #game.on{display:block}
  .ghud{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;
    font-weight:700;font-size:18px;z-index:2;pointer-events:none}
  .gem{position:absolute;top:-60px;font-size:44px;cursor:pointer;animation:fall linear forwards;z-index:1}
  @keyframes fall{to{top:110%}}
  .gem.rock{filter:grayscale(1)}
  .gmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    text-align:center;padding:30px;z-index:3;background:rgba(8,5,30,.82)}
  .gmsg h2{margin:0;font-size:26px}
  .gmsg p{margin:0;opacity:.85;line-height:1.4}
  .btn{padding:12px 26px;border-radius:999px;border:0;font-size:16px;font-weight:700;color:#fff;cursor:pointer;
    background:linear-gradient(160deg,#7c3aed,#c026d3)}
  .btn.ghost{background:var(--panel);border:1px solid var(--line)}

  @media (max-height:640px){.act b{font-size:22px}.act{padding:6px 2px}}
  @media (max-width:360px){.stat .l span:last-child{font-size:11px}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="app">
  <div class="stars"></div>
  <div class="rain" id="rain"></div>

  <div class="top">
    <button class="name" id="nameBtn" aria-label="Переименовать"><span id="nameTxt">Дракоша</span><small id="ageTxt">День 1</small></button>
    <div class="chip" title="Монеты">💎 <span id="coins">30</span></div>
    <button class="icon-btn" id="muteBtn" aria-label="Звук">🔊</button>
  </div>

  <div class="stats">
    <div class="stat" id="s-love"><div class="l"><span>💜</span><span class="v">0</span></div><div class="bar"><i></i></div></div>
    <div class="stat" id="s-food"><div class="l"><span>🍖</span><span class="v">0</span></div><div class="bar"><i></i></div></div>
    <div class="stat" id="s-fun"><div class="l"><span>🎈</span><span class="v">0</span></div><div class="bar"><i></i></div></div>
    <div class="stat" id="s-energy"><div class="l"><span>⚡</span><span class="v">0</span></div><div class="bar"><i></i></div></div>
    <div class="stat" id="s-clean"><div class="l"><span>🫧</span><span class="v">0</span></div><div class="bar"><i></i></div></div>
  </div>

  <div class="stage" id="stage">

    <div class="bubble" id="bubble"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const KEY = 'dragon_pet_v1';
  const clamp = (v,a=0,b=100) => Math.max(a, Math.min(b, v));
  const rnd = a => a[Math.floor(Math.random()*a.length)];
  const rr = (a,b) => a + Math.random()*(b-a);

  const FOODS = [
    {e:'🍪', n:'Камешек',   price:5,  food:18, fun:2},
    {e:'🍖', n:'Мясо',      price:10, food:35, fun:4},
    {e:'🔮', n:'Кристалл',  price:20, food:55, fun:15},
  ];

  const fresh = () => ({name:'Дракоша', food:70, fun:70, energy:80, clean:80, love:80, coins:30,
                        sleeping:false, born:Date.now(), last:Date.now(), muted:false, taps:0});
  let ready = false, nextAct = Date.now() + 8000;
  let S;
  try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){ S = fresh(); }

  const RATE = {food:-2.2, fun:-1.8, clean:-1.3, energy:-1.1};
  function decay(minutes){
    const sl = S.sleeping;
    S.food  = clamp(S.food  + RATE.food  * minutes * (sl?.5:1), 5);
    S.fun   = clamp(S.fun   + RATE.fun   * minutes * (sl?.5:1), 5);
    S.clean = clamp(S.clean + RATE.clean * minutes, 5);
    S.energy= clamp(sl ? S.energy + 9*minutes : S.energy + RATE.energy*minutes, 5);
    if (sl && S.energy >= 100) wake(true);
  }
  // Пока игры не было: шкалы падают, а дракон скучает
  const away = Math.min((Date.now() - S.last) / 60000, 480);
  if (away > 0.2) decay(away);
  if (away > 2 && !S.sleeping) S.love = Math.max(5, S.love - away * 20);
  S.last = Date.now();
  const save = () => { S.last = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

  // ---------- звук ----------
  let ac;
  function tone(f=440, d=.12, type='sine', slide=0, vol=.15){
    if (S.muted) return;
    try{
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, ac.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide), ac.currentTime + d);
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    }catch(e){}
  }
  const sRoar  = () => { tone(180,.25,'sawtooth',-60,.12); setTimeout(()=>tone(260,.18,'square',120,.08),90); };
  const sHappy = () => { tone(520,.1,'triangle',200); setTimeout(()=>tone(780,.14,'triangle',200),100); };
  const sGiggle= () => { [0,90,180].forEach((t,i)=>setTimeout(()=>tone(600+i*120,.07,'triangle',120,.1),t)); };
  const sChomp = () => tone(150,.09,'square',-40,.12);
  const sCoin  = () => { tone(900,.08,'square',0,.08); setTimeout(()=>tone(1300,.12,'square',0,.08),70); };
  const sBad   = () => tone(200,.2,'sawtooth',-100,.1);
  const sWhimper = () => { tone(520,.45,'sine',-260,.09); setTimeout(()=>tone(440,.5,'sine',-220,.08),380); };

  // ---------- состояние эмоций ----------
  let joy = 0;                 // радость от недавнего общения, 0..1
  let lastTouch = Date.now();  // когда с питомцем в последний раз общались
  let eating = false;
  let emo = 'calm', prevEmo = 'calm';

  function touch(love, j=1){
    lastTouch = Date.now();
    S.love = clamp(S.love + love);
    joy = Math.max(joy, j);
    nextAct = Date.now() + rr(9000, 14000);
  }
  function calcEmotion(){
    if (S.sleeping) return 'sleep';
    const avg = (S.food + S.fun + S.energy + S.clean) / 4;
    const H = .35*avg + .65*S.love + joy*20 - (S.food < 20 ? 10 : 0);
    return H >= 72 ? 'happy' : H >= 50 ? 'calm' : H >= 30 ? 'sad' : 'cry';
  }

  // ---------- лицо: глаза, веки, рот ----------
  const EYES = {L:{cx:322, cy:228, rx:55, ry:55, outer:-1}, R:{cx:491, cy:225, rx:29, ry:46, outer:1}};
  const cur = {top:0, slant:0, bot:0, m:.4};
  let tgt = {top:0, slant:0, bot:0, m:.4};
  let blinkStart = 0, blinkDur = 180, nextBlink = performance.now() + 2500;

  const TARGETS = {
    sleep: () => ({top:1.15, slant:0,  bot:0,  m:.15}),
    happy: () => ({top:0,    slant:0,  bot: joy > .5 ? .4 : .1, m:.85}),
    calm:  () => ({top:.06,  slant:0,  bot:.03, m:.4}),
    sad:   () => ({top:.36,  slant:16, bot:0,  m:-.85}),
    cry:   () => ({top:.5,   slant:20, bot:.05, m:-1.1}),
  };

  function lids(key, e, top, slant, bot){
    const t = e.cy - e.ry, h = e.ry * 2;
    const x0 = e.cx - e.rx - 8, x1 = e.cx + e.rx + 8;
    const base = t + top * (h + 10) - 6;
    const yo = base + slant, yi = base - slant;
    const yL = e.outer < 0 ? yo : yi, yR = e.outer < 0 ? yi : yo;
    $('#lid'+key+'t').setAttribute('d',
      `M${x0} ${t-14} L${x1} ${t-14} L${x1} ${yR} Q${e.cx} ${base+7} ${x0} ${yL} Z`);
    const bb = e.cy + e.ry - bot * h;
    $('#lid'+key+'b').setAttribute('d', bot <= .01 ? '' :
      `M${x0} ${e.cy+e.ry+14} L${x1} ${e.cy+e.ry+14} L${x1} ${bb+10} Q${e.cx} ${bb-14} ${x0} ${bb+10} Z`);
  }

  function mouth(m, t){
    const q = emo === 'cry' ? Math.sin(t/70) * .1 : 0;
    const mm = m + q;
    const x0 = 352, x1 = 450, y = 318;
    const ye = y - 7 * mm, cy = y + 24 * mm;
    const d = `M${x0} ${ye} Q${(x0+x1)/2} ${cy} ${x1} ${ye+2}`;
    $('#mouth').setAttribute('d', d);
    $('#mouthHi').setAttribute('d', `M${x0+4} ${ye+5} Q${(x0+x1)/2} ${cy+5} ${x1-4} ${ye+7}`);
  }

  function frame(t){
    // моргание
    if (t >= nextBlink && !blinkStart){ blinkStart = t; blinkDur = emo === 'sad' || emo === 'cry' ? 340 : 170; }
    let bl = 0;
    if (blinkStart){
      const p = (t - blinkStart) / blinkDur;
      if (p >= 1){ blinkStart = 0; nextBlink = t + (emo === 'sad' ? rr(3500,6500) : rr(2200,5500)); if (Math.random() < .18) nextBlink = t + 260; }
      else bl = 1.15 * (1 - Math.abs(2*p - 1));
    }
    const k = .14;
    for (const key of ['top','slant','bot','m']) cur[key] += (tgt[key] - cur[key]) * k;
    const top = Math.max(cur.top, bl);
    const slant = cur.slant * (1 - Math.min(1, bl));
    lids('L', EYES.L, top, slant, cur.bot);
    lids('R', EYES.R, top, slant, cur.bot);
    mouth(cur.m, t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const petWrap = $('#petWrap'), bubble = $('#bubble');
  const appEl = $('#app');

  function applyEmotion(){
    prevEmo = emo; emo = calcEmotion();
    tgt = TARGETS[emo]();
    const open = !S.sleeping && (emo === 'happy' || eating || joy > .55);
    $('#petOpen').classList.toggle('on', open);
    $('#mouth').style.opacity = open || S.sleeping ? 0 : 1;
    $('#mouthHi').style.opacity = open || S.sleeping ? 0 : 1;
    $('#face').classList.toggle('cry', emo === 'cry');
    petWrap.classList.toggle('sad', emo === 'sad' || emo === 'cry');
    petWrap.classList.toggle('cry', emo === 'cry');
    petWrap.classList.toggle('happy', emo === 'happy');
    petWrap.classList.toggle('sleep', S.sleeping);
    petWrap.classList.toggle('dirty', !S.sleeping && S.clean < 25 && emo !== 'cry');
    appEl.classList.toggle('mood-sad', emo === 'sad' || emo === 'cry');
    appEl.classList.toggle('mood-cry', emo === 'cry');
    appEl.classList.toggle('mood-happy', emo === 'happy');
    if (emo !== prevEmo){
      if (emo === 'sad' && prevEmo !== 'cry') { say(rnd(['Ты меня забыл?.. 🥺','Мне одиноко...','Поиграй со мной...'])); sWhimper(); }
      if (emo === 'cry') { say(rnd(['Ты ушёл... 😢','Мне так грустно...','Хнык... потрогай меня']), 3200); sWhimper(); }
    }
  }

  // ---------- интерфейс ----------
  let bubbleT;
  function say(t, ms=2600){
    bubble.textContent = t; bubble.classList.add('on');
    clearTimeout(bubbleT); bubbleT = setTimeout(()=>bubble.classList.remove('on'), ms);
  }
  function anim(cls, ms){
    petWrap.classList.remove('tap','shake','jump','eat','hop');
    void petWrap.offsetWidth;
    petWrap.classList.add(cls);
    setTimeout(()=>petWrap.classList.remove(cls), ms);
  }
  function fx(emoji, x, y){
    const r = $('#stage').getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'fx'; el.textContent = emoji;
    el.style.left = (x - r.left) + 'px'; el.style.top = (y - r.top) + 'px';
    $('#stage').appendChild(el); setTimeout(()=>el.remove(), 1200);
  }
  function fxCenter(emoji, n=3){
    const r = petWrap.getBoundingClientRect();
    for (let i=0;i<n;i++) setTimeout(()=>fx(emoji, r.left + r.width*(.3+Math.random()*.4), r.top + r.height*(.2+Math.random()*.3)), i*140);
  }

  function setBar(id, v){
    const el = $('#s-'+id);
    el.querySelector('i').style.width = v + '%';
    el.querySelector('.v').textContent = Math.round(v);
    el.querySelector('i').style.background = v < 25 ? '#fb7185' : v < 55 ? '#fbbf24' : (id === 'love' ? '#f472b6' : 'var(--cyan)');
    el.classList.toggle('low', v < 25);
  }
  const MOOD_TXT = {happy:'счастлив 😄', calm:'спокоен 🙂', sad:'грустит 😔', cry:'плачет 😢', sleep:'спит 😴'};
  function render(){
    ['love','food','fun','energy','clean'].forEach(k => setBar(k, S[k]));
    $('#coins').textContent = S.coins;
    $('#nameTxt').textContent = S.name;
    const days = Math.floor((Date.now()-S.born)/86400000) + 1;
    $('#ageTxt').textContent = 'День ' + days + ' · ' + MOOD_TXT[emo];
    $('#muteBtn').textContent = S.muted ? '🔇' : '🔊';
    $('#night').classList.toggle('on', S.sleeping);
    $('#zzz').classList.toggle('on', S.sleeping);
    $('#bSleep').classList.toggle('on', S.sleeping);
    $('#bSleep').innerHTML = S.sleeping ? '<b>☀️</b>Будить' : '<b>🌙</b>Спать';
  }
  function refresh(){ applyEmotion(); render(); }

  // дождик в грустном режиме
  (() => {
    const r = $('#rain');
    for (let i=0;i<26;i++){
      const d = document.createElement('i');
      d.style.left = (Math.random()*100) + '%';
      d.style.animationDelay = (-Math.random()*1.1) + 's';
      d.style.animationDuration = (.8 + Math.random()*.6) + 's';
      r.appendChild(d);
    }
  })();

  // ---------- действия ----------
  function wake(auto){
    S.sleeping = false;
    if (!ready) return;
    touch(0, 0);
    if (!auto) say(rnd(['Ммм... я проснулся!','Доброе утро! 🌅']));
    else say('Выспался! Полон сил ⚡');
    refresh();
  }
  function needSleepCheck(){
    if (S.sleeping){ wake(); anim('shake',500); sRoar(); return true; }
    return false;
  }

  let lastStroke = 0;
  petWrap.addEventListener('pointerdown', e => {
    if (needSleepCheck()) { save(); return; }
    const wasSad = emo === 'sad' || emo === 'cry';
    S.taps++;
    S.fun = clamp(S.fun + 2);
    touch(wasSad ? 14 : 5);
    anim('tap', 450);
    fx(rnd(['💜','✨','💖','⭐']), e.clientX, e.clientY);
    if (wasSad){ sHappy(); setTimeout(sGiggle, 200); } else if (S.taps % 2 === 0) sHappy(); else sRoar();
    if (S.taps % 8 === 0){ S.coins++; sCoin(); fx('💎', e.clientX, e.clientY - 30); }
    const lines = wasSad ? ['Ты вернулся! 💜','Ура! Ты рядом!','Я так скучал! 🥹','Не уходи больше!'] :
                  S.food < 25 ? ['Я хочу кушать! 🍖','Живот урчит...'] :
                  S.clean < 25 ? ['Я весь в пыли, помой меня 🛁'] :
                  S.energy < 25 ? ['Я устал... 😴'] :
                  ['Хи-хи! Щекотно!','Ррр! Я каменный дракончик!','Ещё! Ещё!','Ты мой лучший друг 💜','Погладь ещё!','Кристаллы блестят ✨'];
    say(rnd(lines));
    refresh(); save();
  });
  // поглаживание: вести пальцем по дракону
  petWrap.addEventListener('pointermove', e => {
    if (!e.buttons || S.sleeping) return;
    const now = Date.now();
    if (now - lastStroke < 350) return;
    lastStroke = now;
    touch(2.5, .8);
    fx(rnd(['💜','💖']), e.clientX, e.clientY);
    if (Math.random() < .3) sGiggle();
    refresh();
  });
  // голова следит за пальцем/курсором
  document.addEventListener('pointermove', e => {
    if (S.sleeping || emo === 'cry') return;
    const r = petWrap.getBoundingClientRect();
    const dx = clamp(((e.clientX - (r.left + r.width/2)) / (window.innerWidth/2)), -1, 1);
    $('#petLook').style.transform = `translateX(${dx*8}px) rotate(${dx*2.5}deg)`;
  });

  function buildFoods(){
    $('#foods').innerHTML = FOODS.map((f,i) =>
      `<button class="food ${S.coins<f.price?'no':''}" data-i="${i}"><b>${f.e}</b>${f.n}<span>💎 ${f.price}</span></button>`).join('');
  }
  $('#bFeed').onclick = () => {
    if (needSleepCheck()) return;
    buildFoods(); $('#sheet').classList.toggle('on');
  };
  $('#foods').onclick = e => {
    const b = e.target.closest('.food'); if (!b) return;
    const f = FOODS[+b.dataset.i];
    if (S.coins < f.price){ say('Не хватает монет 💎 Сыграй в «Добычу»!'); sBad(); return; }
    if (S.food > 95){ say('Я уже сыт, спасибо!'); return; }
    S.coins -= f.price; S.food = clamp(S.food + f.food); S.fun = clamp(S.fun + f.fun);
    touch(14, .7);
    $('#sheet').classList.remove('on');
    const fl = document.createElement('div'); fl.className = 'foodFly'; fl.textContent = f.e;
    $('#stage').appendChild(fl); setTimeout(()=>fl.remove(), 800);
    setTimeout(()=>{ eating = true; refresh(); anim('eat', 1050); sChomp(); setTimeout(sChomp,350); setTimeout(sChomp,700); }, 650);
    setTimeout(()=>{ eating = false; say(rnd(['Ням-ням! Вкусно! 😋','Ммм, ещё хочу!','Спасибо! 💜'])); fxCenter('💜',3); sHappy(); refresh(); save(); }, 1750);
    refresh(); save();
  };

  $('#bPlay').onclick = () => {
    if (needSleepCheck()) return;
    $('#sheet').classList.remove('on');
    if (S.energy < 15){ say('Я слишком устал играть... 😴'); sBad(); return; }
    S.fun = clamp(S.fun + 22); S.energy = clamp(S.energy - 8); S.food = clamp(S.food - 3);
    touch(20, 1);
    anim('jump', 1800); sHappy(); setTimeout(sGiggle, 600); setTimeout(sHappy, 900);
    fxCenter('⚽',1); fxCenter('⭐',3);
    say(rnd(['Ура, играем! 🎉','Лови меня!','Прыг-скок!']));
    refresh(); save();
  };

  let washing = false;
  $('#bWash').onclick = () => {
    if (needSleepCheck()) return;
    $('#sheet').classList.remove('on');
    if (washing) return;
    washing = true;
    const soap = $('#soap'); soap.innerHTML = '';
    for (let i=0;i<16;i++){
      const s = document.createElement('span'), sz = 14 + Math.random()*30;
      s.style.cssText = `left:${Math.random()*90}%;width:${sz}px;height:${sz}px;animation-delay:${Math.random()*1.2}s`;
      soap.appendChild(s);
    }
    soap.classList.add('on'); anim('shake', 1600);
    touch(10, .6);
    for (let i=0;i<6;i++) setTimeout(()=>tone(700+Math.random()*600,.07,'sine',300,.07), i*220);
    say('Буль-буль! 🫧', 2000);
    setTimeout(()=>{
      soap.classList.remove('on'); washing = false;
      S.clean = 100; S.fun = clamp(S.fun + 4);
      say('Чистый и блестящий! ✨'); fxCenter('✨',4); sHappy(); refresh(); save();
    }, 2000);
    refresh();
  };

  $('#bSleep').onclick = () => {
    $('#sheet').classList.remove('on');
    if (S.sleeping){ wake(); }
    else {
      if (S.energy > 92){ say('Я не хочу спать, полон сил!'); return; }
      S.sleeping = true; say('Спокойной ночи... 🌙', 1800); tone(400,.4,'sine',-200,.1);
    }
    refresh(); save();
  };

  $('#nameBtn').onclick = () => {
    const n = prompt('Как зовут твоего дракончика?', S.name);
    if (n && n.trim()){ S.name = n.trim().slice(0,16); touch(6, .6); refresh(); save(); say('Теперь я ' + S.name + '! 💜'); }
  };
  $('#muteBtn').onclick = () => { S.muted = !S.muted; render(); save(); if(!S.muted) sHappy(); };

  // ---------- мини-игра ----------
  const G = {on:false, score:0, time:20, spawnT:null, tickT:null};
  const game = $('#game');
  $('#bGame').onclick = () => {
    if (needSleepCheck()) return;
    $('#sheet').classList.remove('on');
    game.classList.add('on'); $('#gStart').style.display = 'flex'; $('#gEnd').style.display = 'none';
  };
  function gStop(){ G.on = false; clearInterval(G.spawnT); clearInterval(G.tickT); game.querySelectorAll('.gem').forEach(g=>g.remove()); }
  function gClose(){ gStop(); game.classList.remove('on'); refresh(); }
  $('#gExit0').onclick = gClose; $('#gExit1').onclick = gClose;
  $('#gGo').onclick = $('#gAgain').onclick = gStart;

  function spawn(){
    const rock = Math.random() < .22;
    const el = document.createElement('div');
    el.className = 'gem' + (rock ? ' rock' : '');
    el.textContent = rock ? '🪨' : rnd(['💎','💎','🔮']);
    el.style.left = (4 + Math.random()*82) + '%';
    el.style.animationDuration = (1.9 + Math.random()*1.5) + 's';
    el.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      if (!G.on || el.dataset.hit) return;
      el.dataset.hit = 1;
      if (rock){ G.score = Math.max(0, G.score - 2); sBad(); el.textContent = '💥'; }
      else { G.score++; sCoin(); el.textContent = '✨'; }
      $('#gScore').textContent = G.score;
      setTimeout(()=>el.remove(), 180);
    });
    el.addEventListener('animationend', () => el.remove());
    game.appendChild(el);
  }
  function gStart(){
    G.score = 0; G.time = 20; G.on = true;
    $('#gScore').textContent = 0; $('#gTime').textContent = 20;
    $('#gStart').style.display = 'none'; $('#gEnd').style.display = 'none';
    G.spawnT = setInterval(spawn, 480);
    G.tickT = setInterval(() => {
      G.time--; $('#gTime').textContent = G.time;
      lastTouch = Date.now();   // пока играем — дракон не скучает
      if (G.time <= 0){
        gStop();
        S.coins += G.score; S.fun = clamp(S.fun + 10); S.energy = clamp(S.energy - 6);
        touch(12, 1); save();
        $('#gEndTitle').textContent = G.score >= 20 ? 'Отличная добыча! 🏆' : 'Готово!';
        $('#gEndText').textContent = 'Собрано: ' + G.score + ' 💎 — монеты добавлены.';
        $('#gEnd').style.display = 'flex'; sHappy();
        $('#coins').textContent = S.coins;
      }
    }, 1000);
  }

  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('#sheet') && !e.target.closest('#bFeed')) $('#sheet').classList.remove('on');
  });

  // ---------- «жизнь»: скучает без общения и ведёт себя по настроению ----------
  const SAD_LINES = ['Мне одиноко... 🥺','Поиграй со мной...','Ты про меня забыл?','Погладь меня, пожалуйста','Хнык...'];
  const HAPPY_LINES = ['Мне так хорошо! 💜','Ла-ла-ла~ ♪','Я самый крутой дракон!','Люблю кристаллы! ✨','Ты лучший!'];
  const CALM_LINES = ['Что будем делать?','Эй, я тут!','Посмотри, как я блестю ✨','Может, поиграем?'];

  let lastTick = Date.now();
  setInterval(() => {
    const now = Date.now(), dt = (now - lastTick) / 60000; lastTick = now;
    decay(dt);
    const idle = (now - lastTouch) / 1000;
    if (!S.sleeping && !G.on && idle > 10) S.love = clamp(S.love - 1.6 * Math.min(dt*60, 3));
    joy = Math.max(0, joy - Math.min(dt*60, 3) / 12);

    if (!S.sleeping && !G.on && now >= nextAct && !washing){
      if (emo === 'happy'){
        anim('hop', 600); if (Math.random() < .6) sGiggle();
        say(rnd(HAPPY_LINES)); fxCenter(rnd(['💜','✨','🎵']),2);
        nextAct = now + rr(9000, 15000);
      } else if (emo === 'calm'){
        if (Math.random() < .5){ say(rnd(CALM_LINES)); anim('hop', 600); }
        nextAct = now + rr(10000, 16000);
      } else if (emo === 'sad'){
        say(rnd(SAD_LINES)); sWhimper();
        nextAct = now + rr(10000, 15000);
      } else if (emo === 'cry'){
        say(rnd(['Хнык-хнык... 😭','Мне очень грустно...','Не оставляй меня одного']), 3000); sWhimper();
        nextAct = now + rr(8000, 12000);
      }
    }
    refresh(); save();
  }, 1000);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { save(); return; }
    const m = Math.min((Date.now()-S.last)/60000, 480);
    lastTick = Date.now();
    if (m > .05) decay(m);
    if (m > 2 && !S.sleeping){ S.love = Math.max(5, S.love - m*20); lastTouch = Date.now() - 60000; say('Ты так долго не приходил... 😢', 3500); }
    refresh();
  });
  window.addEventListener('pagehide', save);

  ready = true;
  refresh();
  setTimeout(() => {
    if (emo === 'sad' || emo === 'cry') say('Ты вернулся... я скучал 🥺', 3500);
    else say('Привет! Потрогай меня 👆', 3000);
  }, 500);
})();
</script>
</body>
</html>
